services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_starter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_starter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: financial-dream-planner-backend:latest
    build: ./backend
    command: ["node", "dist/migrate.js"]
    restart: "no"
    env_file: ./backend/.env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: financial-dream-planner-backend:latest
    build: ./backend
    command: ["node", "dist/server.js"]
    env_file: ./backend/.env
    ports:
      - "${API_PORT:-4005}:4000"
    volumes:
      - ./backend/dist:/app/dist
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    image: financial-dream-planner-backend:latest
    build: ./backend
    command: ["node", "dist/worker.js"]
    env_file: ./backend/.env
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: financial-dream-planner-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:4000
    ports:
      - "${WEB_PORT:-3005}:3000"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
