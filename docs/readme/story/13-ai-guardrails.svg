<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Guarded AI planner"><defs><style>.b{font:700 29px Georgia,serif;fill:#132642}.h{font:700 54px Georgia,serif;fill:#132642}.s{font:400 21px Arial,sans-serif;fill:#40506a}.t{font:700 23px Georgia,serif;fill:#132642}.x{font:400 17px Arial,sans-serif;fill:#687187}.p{stroke:#7465d2;stroke-width:4;fill:none}.g{stroke:#82a28a;stroke-width:4;fill:none;stroke-dasharray:10 10}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7465d2"/></marker></defs><rect width="1600" height="900" fill="#fbf3e4"/><circle cx="1510" cy="70" r="190" fill="#ddd5f4" opacity=".35"/><g transform="translate(60 52)"><path d="M0 0h25v48L0 35z" fill="#7465d2"/><path d="M31 0h25v35L31 48z" fill="#82a28a"/><text x="78" y="37" class="b">Financial Dream Planner</text></g><text x="62" y="175" class="h">AI can reason. It cannot own the math.</text><text x="65" y="225" class="s">Typed tools, deterministic calculations, cited research, risk rules and a critic bound every answer.</text><rect x="65" y="340" width="260" height="210" rx="28" fill="#fffdf8" stroke="#c8c0d5"/><circle cx="195" cy="410" r="42" fill="#eee9fb"/><text x="195" y="420" class="t" text-anchor="middle">You</text><text x="100" y="495" class="x">“Can I take another EMI</text><text x="100" y="525" class="x">without delaying my home?”</text><path d="M325 445H430" class="p" marker-end="url(#a)"/><rect x="445" y="300" width="385" height="350" rx="28" fill="#fffdf8" stroke="#c8c0d5" stroke-width="2"/><text x="485" y="355" class="t">Bounded planner graph</text><rect x="485" y="395" width="305" height="58" rx="15" fill="#eee9fb"/><text x="505" y="431" class="t">Supervisor + injection check</text><rect x="485" y="475" width="305" height="58" rx="15" fill="#f2eadc"/><text x="505" y="511" class="t">Read financial state</text><rect x="485" y="555" width="305" height="58" rx="15" fill="#e6efe3"/><text x="505" y="591" class="t">Planner reasoning</text><text x="485" y="635" class="x">No arbitrary SQL · raw HTTP · filesystem.</text><path d="M830 435 C900 400 920 370 955 360" class="p" marker-end="url(#a)"/><path d="M830 535 C900 570 920 610 955 625" class="g" marker-end="url(#a)"/><rect x="970" y="300" width="280" height="255" rx="28" fill="#e6efe3" stroke="#abc1ae"/><text x="1010" y="355" class="t">Typed finance tools</text><text x="1010" y="405" class="x">Cash flow</text><text x="1010" y="440" class="x">Emergency fund</text><text x="1010" y="475" class="x">Loan amortization</text><text x="1010" y="510" class="x">Goal / SIP / net worth</text><rect x="970" y="585" width="280" height="220" rx="28" fill="#eee9fb" stroke="#c8c0d5"/><text x="1010" y="640" class="t">Cited research</text><text x="1010" y="690" class="x">RBI · SEBI · tax · filings</text><text x="1010" y="725" class="x">Tavily provider abstraction</text><text x="1010" y="760" class="x">SSRF-safe document fetch</text><path d="M1250 430H1340" class="p" marker-end="url(#a)"/><path d="M1250 680 C1300 650 1310 590 1340 555" class="g" marker-end="url(#a)"/><rect x="1355" y="330" width="195" height="315" rx="28" fill="#fffdf8" stroke="#d8cab9"/><text x="1390" y="385" class="t">Guardrails</text><text x="1390" y="435" class="x">● Risk policy</text><text x="1390" y="478" class="x">● Critic</text><text x="1390" y="521" class="x">● Fresh citations</text><text x="1390" y="564" class="x">● Tenant checks</text><text x="1390" y="615" class="t">Guarded answer</text><rect x="445" y="705" width="385" height="115" rx="24" fill="#f2eadc"/><text x="485" y="752" class="t">Provider fallback</text><text x="485" y="788" class="x">OpenAI-compatible primary → Gemini</text><text x="485" y="812" class="x">Only before visible output begins.</text><rect x="65" y="690" width="300" height="145" rx="24" fill="#e6efe3"/><text x="95" y="735" class="t">Privacy boundary</text><text x="95" y="775" class="x">No hidden chain-of-thought, raw</text><text x="95" y="803" class="x">provider traces or system prompts</text><text x="95" y="831" class="x">are persisted.</text></svg>