onthly take-home</text><text x="1165" y="300" class="t r" text-anchor="end">−₹5,000</text><text x="905" y="337" class="x">− Emergency cushion slower</text><text x="1165" y="337" class="t r" text-anchor="end">−3 mo</text><rect x="1225" y="115" width="310" height="260" rx="22" fill="#f2eadc"/><text x="1260" y="165" class="t">Key changes</text><text x="1260" y="215" class="x">SIP</text><text x="1500" y="215" class="t" text-anchor="end">₹15k → ₹20k</text><text x="1260" y="255" class="x">Retirement age</text><text x="1500" y="255" class="t" text-anchor="end">60 → 57</text><text x="1260" y="295" class="x">Monthly surplus</text><text x="1500" y="295" class="t r" text-anchor="end">₹18k → ₹13k</text><text x="1260" y="335" class="x">Insurance cover</text><text x="1500" y="335" class="t" text-anchor="end">No change</text><rect x="510" y="410" width="690" height="285" rx="22" fill="#fffdf8" stroke="#c8c0d5"/><text x="545" y="458" class="t">Wealth Projection Comparison</text><text x="545" y="505" class="m g">₹2.48 Cr</text><text x="690" y="505" class="x">with SIP +₹5,000</text><path d="M565 645 L565 625 L675 604 L785 565 L895 520 L1005 475 L1140 445 L1140 650 Z" fill="#ddd5f4" opacity=".35"/><polyline points="565,625 675,604 785,565 895,520 1005,475 1140,445" fill="none" stroke="#7465d2" stroke-width="5"/><polyline points="565,625 675,612 785,585 895,550 1005,515 1140,490" fill="none" stroke="#8f86bd" stroke-width="4" stroke-dasharray="8 8"/><rect x="1225" y="410" width="310" height="285" rx="22" fill="#fffdf8" stroke="#c8c0d5"/><text x="1260" y="458" class="t">Cash Flow Snapshot</text><text x="1260" y="515" class="x">Current in-hand</text><text x="1500" y="515" class="t" text-anchor="end">₹1,20,000</text><text x="1260" y="562" class="x">After SIP increase</text><text x="1500" y="562" class="t" text-anchor="end">₹1,15,000</text><text x="1260" y="609" class="x">Monthly surplus</text><text x="1500" y="609" class="t r" text-anchor="end">₹13,000</text><text x="1260" y="656" class="x">Savings rate</text><text x="1500" y="656" class="t" text-anchor="end">18%</text><rect x="510" y="730" width="1025" height="110" rx="22" fill="#eee9fb"/><text x="545" y="775" class="t">AI Recommendation</text><text x="750" y="770" class="s">A better-balanced alternative: increase SIP by ₹3,000/month.</text><text x="750" y="807" class="x">Retain most long-term benefit with less short-term pressure.</text><path d="M35 820 q90 -130 180 0t180 0" fill="none" stroke="#b9c8e8" stroke-width="36" opacity=".45"/></svg>