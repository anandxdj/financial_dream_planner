48" rx="22" fill="#e6efe3" stroke="#c8c0d5" stroke-width="2" /><text x="762" y="499" class="small" text-anchor="middle">₹68,000</text><rect x="600" y="510" width="225" height="70" rx="22" fill="#fffdf8" stroke="#c8c0d5" stroke-width="2" /><text x="615" y="540" class="small">Any loans or EMIs?</text><rect x="690" y="588" width="145" height="48" rx="22" fill="#e6efe3" stroke="#c8c0d5" stroke-width="2" /><text x="762" y="619" class="small" text-anchor="middle">₹18,500</text><text x="975" y="205" class="h3">AI Financial Assistant</text><rect x="965" y="270" width="235" height="78" rx="22" fill="#fffdf8" stroke="#c8c0d5" stroke-width="2" /><text x="980" y="300" class="small">What are your top goals?</text><rect x="990" y="365" width="205" height="105" rx="22" fill="#e6efe3" stroke="#c8c0d5" stroke-width="2" /><text x="1008" y="397" class="small">• Emergency fund</text><text x="1008" y="427" class="small">• Buy a home</text><text x="1008" y="457" class="small">• Retire early</text><rect x="965" y="492" width="235" height="92" rx="22" fill="#fffdf8" stroke="#c8c0d5" stroke-width="2" /><text x="980" y="524" class="small">How much have you saved?</text><text x="1090" y="566" class="small" text-anchor="middle">₹2,50,000</text><rect x="1280" y="145" width="260" height="510" rx="22" fill="#fffdf8" stroke="#c8c0d5" stroke-width="2" filter="url(#shadow)"/><text x="1310" y="195" class="h2">Profile detected</text><text x="1310" y="235" class="body">Ananya · Bengaluru</text><text x="1310" y="290" class="h3">Plan readiness</text><circle cx="1355" cy="355" r="54" fill="none" stroke="#e5dfd9" stroke-width="14"/><path d="M1355 301 A54 54 0 1 1 1307 380" fill="none" stroke="#7465d2" stroke-width="14" stroke-linecap="round"/><text x="1355" y="364" class="metric" text-anchor="middle">78%</text><text x="1310" y="445" class="h3">Extracted summary</text><text x="1310" y="482" class="small">Income</text><text x="1510" y="482" class="small" text-anchor="end">₹1,20,000/mo</text><text x="1310" y=